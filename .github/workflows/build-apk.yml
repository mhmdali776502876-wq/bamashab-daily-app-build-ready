name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -o *.zip -d project
          cd project
          if [ -f pubspec.yaml ]; then
            echo "PROJECT=." >> $GITHUB_ENV
          else
            ROOT=$(find . -name pubspec.yaml -printf '%h\n' | head -1)
            echo "PROJECT=$ROOT" >> $GITHUB_ENV
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        working-directory: project
        run: |
          cd "$PROJECT"
          flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          cd "$PROJECT"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: project/**/build/app/outputs/flutter-apk/app-release.apk
